<!DOCTYPE html>
<html>
<head>
<title>Be My Valentine ❤️</title>

<style>
body {
  background: pink;
  font-family: Arial;
  text-align: center;
  height: 100vh;
  overflow: hidden;
}

button {
  padding: 15px 25px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  position: absolute;
}

#yes {
  left: 45%;
  top: 50%;
}

#no {
  left: 55%;
  top: 50%;
}

</style>
</head>

<body>

<h1>Erika, Will you be my Valentine? ❤️</h1>

<button id="yes" onclick="yes()">Yes 💕</button>
<button id="no" onmouseover="moveNo()">No 💔</button>

<script>
function yes() {
  document.body.innerHTML = "<h1>Yay! You just made me the happiest person ❤️😍</h1>";
}

function moveNo() {
  let x = Math.random() * (window.innerWidth - 100);
  let y = Math.random() * (window.innerHeight - 50);

  document.getElementById("no").style.left = x + "px";
  document.getElementById("no").style.top = y + "px";
}
</script>

</body>
</html>
